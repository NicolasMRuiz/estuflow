name: EstuFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Caché pública de imágenes Docker fijadas
        run: |
          sudo python3 - <<'PYTHON'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          settings = json.loads(path.read_text()) if path.exists() else {}
          mirrors = settings.setdefault('registry-mirrors', [])
          if 'https://mirror.gcr.io' not in mirrors:
              mirrors.append('https://mirror.gcr.io')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(settings))
          PYTHON
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - run: ./scripts/setup.sh
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh
      - run: ./scripts/e2e.sh
      - name: Capturas revisables M02 y M03
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: estuflow-capturas
          path: |
            docs/evidence/m02/*.png
            docs/evidence/m03/*.png
            docs/evidence/m03-correction/**/*.png
          retention-days: 14
          if-no-files-found: warn
