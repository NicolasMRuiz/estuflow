name: EstuFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: ./scripts/setup.sh
      - run: ./scripts/check.sh
      - run: ./scripts/test.sh
      - run: ./scripts/e2e.sh
